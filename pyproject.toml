[project]
name = "pmm-mcp"
version = "0.3.0"
description = "MCP server (read-only by default) for Percona Monitoring and Management (PMM) 2.x and 3.x: PromQL metrics and Query Analytics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Burak Alkis" }]
requires-python = ">=3.11"
dependencies = ["mcp[cli]>=2", "httpx"]
keywords = ["mcp", "pmm", "percona", "mysql", "mongodb", "postgresql", "monitoring"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
