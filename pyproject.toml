[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pmm-mcp"
version = "0.3.1"
description = "MCP server (read-only by default) for Percona Monitoring and Management (PMM) 2.x and 3.x: PromQL metrics and Query Analytics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Burak Alkis" }]
requires-python = ">=3.11"
dependencies = ["mcp[cli]>=2", "httpx"]
keywords = ["mcp", "pmm", "percona", "mysql", "mongodb", "postgresql", "monitoring"]

[project.urls]
Homepage = "https://github.com/hakkiburakalks/pmm-mcp"
Issues = "https://github.com/hakkiburakalks/pmm-mcp/issues"
Changelog = "https://github.com/hakkiburakalks/pmm-mcp/blob/main/CHANGELOG.md"

[project.scripts]
pmm-mcp = "pmm_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["pmm_mcp"]

[tool.hatch.build.targets.sdist]
include = ["pmm_mcp", "tests", "README.md", "LICENSE", "CHANGELOG.md", "SECURITY.md", "server.py", "pmm.env.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
